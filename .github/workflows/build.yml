# Builds the app and the disk image on every push to master.
# A pushed version tag (v1.2, v1.3, ...) also publishes the DMG as a GitHub release.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release on tag pushes

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Same Xcode as the local builds; the runner default may be newer
      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build DMG
        run: Scripts/make-dmg.swift

      - uses: actions/upload-artifact@v7
        with:
          name: Folder Crest DMG
          path: dmg_build/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made on github.com already exists when its tag push arrives
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dmg_build/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dmg_build/*.dmg --generate-notes
          fi
