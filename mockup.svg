<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .win   { fill:#f2f2f4; stroke:#c8c8cc; }
      .panel { fill:#e9e9ec; stroke:#d5d5d9; }
      .card  { fill:#ffffff; stroke:#dcdce0; }
      .lbl   { font-size:12px; fill:#3c3c43; }
      .dim   { font-size:11px; fill:#8a8a8e; }
      .hdr   { font-size:11px; fill:#8a8a8e; letter-spacing:.6px; }
      .ttl   { font-size:13px; fill:#1c1c1e; font-weight:600; }
      .btn   { fill:#ffffff; stroke:#c4c4c8; }
      .prim  { fill:#007aff; stroke:none; }
      .track { fill:#d3d3d8; }
      .fill  { fill:#007aff; }
      .knob  { fill:#ffffff; stroke:#b0b0b6; }
      .note  { font-size:11px; fill:#c0392b; font-style:italic; }
      .dash  { fill:none; stroke:#a0a0a6; stroke-dasharray:5 4; }
    </style>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8fb"/><stop offset="1" stop-color="#5cb8ee"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5e2fc"/><stop offset="1" stop-color="#8ed8fb"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect class="win" x="10" y="10" width="1220" height="780" rx="12"/>

